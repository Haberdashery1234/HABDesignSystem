disabled_rules:
- trailing_whitespace
- identifier_name

opt_in_rules:
- empty_count
- empty_string
- trailing_semicolon
- unused_closure_parameter
- xct_specific_matcher
- multiline_arguments_brackets
- multiline_literal_brackets
- multiline_parameters_brackets
- closure_body_length
- switch_case_alignment
- prefer_zero_over_explicit_init
- no_space_in_method_call
- indentation_width
- vertical_whitespace_opening_braces
- vertical_whitespace_closing_braces

# Lint the package (Sources, Tests) and the sample app. Paths are relative to
# this file, so `swiftlint` run from the repo root picks all of them up.
included:
- Sources
- Tests
- Sample

excluded:
- .build
- build
- Carthage
- Pods

closure_body_length:
    warning: 50
    error: 100

line_length:
    warning: 150
    error: 200
    ignores_function_declarations: true
    ignores_comments: true
    ignores_urls: true
    
function_body_length:
    warning: 300
    error: 500

function_parameter_count:
    warning: 6
    error: 8
    
type_body_length:
    warning: 300
    error: 500
    
file_length:
    warning: 1000
    error: 1500
    ignore_comment_only_lines: true
    
cyclomatic_complexity:
    warning: 15
    error: 25
    ignores_case_statements: true

switch_case_alignment:
    indented_cases: true
    
custom_rules:
    hardcoded_localized_string:
        name: "Hardcoded localized string"
        # Skips interpolated literals (contain \(...\)) — those are already the
        # correct, generic way to localize parameterized text; only a plain
        # literal benefits from being pulled into a generated Catalog symbol.
        regex: '(?<=String\(localized:\s{0,50})"(?!(?:[^"\\]|\\.)*\\\()[^"]'
        match_kinds:
            - string
        message: "Reference the generated String Catalog symbol (String(localized: .yourKey)) instead of a raw string literal."
        severity: warning

    hardcoded_NSLocalizedString:
        name: "Hardcoded localized string"
        regex: '(?<=NSLocalizedString\(\s{0,50})"[^"]'
        match_kinds:
            - string
        message: "Wrap user-facing text in String(localized:) instead of NSLocalizedString."
        severity: warning

    hardcoded_text_assignment:
        name: "Hardcoded .text / .placeholder"
        # Skips a literal that's ENTIRELY one interpolation (e.g. "\(count)")
        # — that's just a formatted value, nothing to translate. A literal
        # with any other text around the interpolation (e.g. "\(count) items")
        # still gets flagged, since that does carry translatable words.
        regex: '(?<=\.(text|placeholder)\s{0,10}=\s{0,10})"(?!\\\([^()]*\)")[^"]'
        match_kinds:
            - string
        message: "Wrap user-facing text in String(localized:) instead of a raw literal."
        severity: warning

    hardcoded_accessibility_string:
        name: "Hardcoded accessibility string"
        regex: '(?<=\.(accessibilityLabel|accessibilityValue|accessibilityHint)\s{0,10}=\s{0,10})"[^"]'
        match_kinds:
            - string
        message: "Wrap accessibility text in String(localized:) instead of a raw literal."
        severity: warning

    hardcoded_set_title:
        name: "Hardcoded setTitle(...)"
        regex: '(?<=setTitle\(\s{0,10})"[^"]'
        match_kinds:
            - string
        message: "Wrap button/control titles in String(localized:) instead of a raw literal."
        severity: warning

    hardcoded_alert_title_message:
        name: "Hardcoded alert title/message/action"
        regex: '(?<=(UIAlertController|UIAlertAction)\([^)]{0,200}\b(title|message)\s{0,10}:\s{0,10})"[^"]'
        match_kinds:
            - string
        message: "Wrap alert titles/messages/actions in String(localized:) instead of a raw literal."
        severity: warning

reporter: "xcode"
